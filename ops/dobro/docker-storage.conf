[Unit]
RequiresMountsFor=/home/ubuntu/porfirevich/media /var/snap/docker/common/var-lib-docker
ConditionPathIsMountPoint=/home/ubuntu/porfirevich/media
ConditionPathIsMountPoint=/var/snap/docker/common/var-lib-docker

[Service]
# Let dockerd stop its containers and containerd in order. The Snap default
# control-group kills containerd alongside dockerd and stalls daemon shutdown.
# This matches the upstream Docker systemd unit.
KillMode=process
TimeoutStopSec=210s
